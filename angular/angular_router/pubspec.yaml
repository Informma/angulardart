name: angulardart_router
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular_router
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
description: Router for AngularDart.
version: 4.0.11
topics:
  - angular
  - router
  - navigation
  - web

screenshots:
  - description: 'AngularDart Router logo'
    path: logo.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  web:

dependencies:
  angulardart: ^9.0.0
  collection: ^1.18.0
  web: ^1.1.1
  meta: ^1.15.0

dev_dependencies:
  async: ^2.11.0
  angulardart_test: ^5.0.0
  build_runner: ^2.4.0
  build_test: ^3.5.19
  build_web_compilers: ^4.0.0
  mockito: ^5.4.0
  lints: ^6.1.0
  test: ^1.25.0

dependency_overrides:
  angulardart:
    path: ../angular
  angulardart_compiler:
    path: ../angular_compiler
  angulardart_ast:
    path: ../angular_ast
  angulardart_test:
    path: ../angular_test
  analyzer: ^14.0.0
