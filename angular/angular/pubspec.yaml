name: angulardart
version: 9.2.1
description: >-
  Community-maintained fork of Google's AngularDart framework.
  Fast and productive web framework for Dart 3.
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
topics:
  - angular
  - web
  - framework
  - dart

screenshots:
  - description: 'AngularDart logo'
    path: logo.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  web:

dependencies:
  built_collection: '>=5.1.0 <6.0.0'
  built_value: '>=8.12.6 <9.0.0'
  collection: '>=1.18.0 <2.0.0'
  intl: '>=0.20.0 <1.0.0'
  web: '>=1.0.0 <2.0.0'
  logging: '>=1.3.0 <2.0.0'
  meta: '>=1.15.0 <2.0.0'
  stack_trace: '>=1.11.0 <2.0.0'
  stream_transform: '>=2.1.0 <3.0.0'

  analyzer: '>=13.0.0 <15.0.0'

  angulardart_meta: '>=1.2.0 <2.0.0'
  angulardart_ast: '>=3.0.0 <4.0.0'
  angulardart_compiler: '>=5.0.0 <6.0.0'

  build: '>=4.0.0 <5.0.0'
  build_config: '>=1.1.0 <2.0.0'
  code_builder: '>=4.10.0 <5.0.0'
  csslib: '>=1.0.0 <2.0.0'
  path: '>=1.9.0 <2.0.0'
  lints: '>=6.0.0 <7.0.0'
  quiver: '>=3.2.0 <4.0.0'
  source_gen: '>=4.0.0 <5.0.0'
  source_span: '>=1.10.0 <2.0.0'

dev_dependencies:
  build_runner: '>=2.16.0 <3.0.0'
  build_web_compilers: '>=4.8.0 <5.0.0'

