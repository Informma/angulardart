name: angulardart
version: 8.0.16
description: >-
  Fast and productive web framework by Google.
  Separate, but similar to the JavaScript framework with a similar name.
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://github.com/flutterdocteur/angulardart
topics:
  - angular
  - web
  - framework
  - dart

screenshots:
  - description: 'AngularDart logo'
    path: logo.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  web:

dependencies:
  built_collection: ^5.1.0
  built_value: ^8.9.0
  collection: ^1.18.0
  intl: ^0.19.0
  web: ^0.5.0
  logging: ^1.3.0
  meta: ^1.15.0
  stack_trace: ^1.11.0
  stream_transform: ^2.1.0
  js: '>=0.6.3 <0.8.0'

  analyzer: ^6.0.0

  angulardart_ast: '>=3.0.0 <3.1.0'
  angulardart_compiler: '>=3.0.0 <3.1.0'

  build: ^2.4.0
  build_config: ^1.1.0
  code_builder: ^4.10.0
  csslib: ^1.0.0
  path: ^1.9.0
  lints: ^4.0.0
  quiver: ^3.2.0
  source_gen: ^1.5.0
  source_span: ^1.10.0

dev_dependencies:
  build_runner: ^2.4.0
  built_value_generator: ^8.9.0
  build_web_compilers: ^4.0.0
