name: angular_compiler
repository: https://github.com/angulardart/angular
description: Compiler for AngularDart.
version: 3.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  analyzer: ^6.0.0
  # Allowing a tiny bit of wiggle here to allow publishing minor updates
  angular: '>=8.0.0 <8.1.0'
  angular_ast: ^3.0.0
  args: ^2.5.0
  build: ^2.4.0
  build_test: ^2.2.3
  code_builder: ^4.10.0
  collection: ^1.18.0
  csslib: ^1.0.0
  dart_style: ^2.3.0
  logging: ^1.3.0
  meta: ^1.15.0
  package_config: ^2.2.0
  path: ^1.9.0
  source_gen: ^1.5.0
  source_span: ^1.10.0
  stack_trace: ^1.11.0

dev_dependencies:
  # This is here in order for it to be resolvable by the analyzer.
  # It is overrode in `dependency_overrides`.
  build_runner: ^2.4.0
  mockito: ^5.4.0
  lints: ^4.0.0
  test: ^1.25.0

dependency_overrides:
  angular:
    path: ../angular
  angular_ast:
    path: ../angular_ast
