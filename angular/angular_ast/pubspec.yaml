name: angulardart_ast
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular_ast
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
description: Parser and utilities for AngularDart templates
version: 3.2.3
topics:
  - angular
  - parser
  - ast
  - template
  - web
screenshots:
  - description: 'AngularDart AST logo'
    path: logo.png
environment:
