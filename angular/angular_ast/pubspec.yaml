platforms:
  web:
dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  charcode: '>=1.3.0 <2.0.0'
  collection: '>=1.18.0 <2.0.0'
  meta: '>=1.15.0 <2.0.0'
  source_span: '>=1.10.0 <2.0.0'
  string_scanner: '>=1.3.0 <2.0.0'
dev_dependencies:
  build_runner: '>=2.16.0 <3.0.0'
  build_test: '>=3.0.0 <4.0.0'
  path: '>=1.9.0 <2.0.0'
  lints: '>=6.0.0 <7.0.0'
  test: '>=1.31.0 <2.0.0'
