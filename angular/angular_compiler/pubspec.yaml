name: angulardart_compiler
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular_compiler
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
description: Compiler for AngularDart.
version: 5.0.6
topics:
  - angular
  - compiler
  - code-generation
  - web

screenshots:
  - description: 'AngularDart Compiler logo'
    path: logo.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  web:

dependencies:
  analyzer: '>=13.0.0 <15.0.0'
  angulardart_meta: '>=1.0.0 <2.0.0'
  angulardart_ast: '>=3.0.0 <4.0.0'
  args: '>=2.5.0 <3.0.0'
  build: '>=4.0.0 <5.0.0'
  build_test: '>=3.0.0 <4.0.0'
  code_builder: '>=4.10.0 <5.0.0'
  collection: '>=1.18.0 <2.0.0'
  csslib: '>=1.0.0 <2.0.0'
  dart_style: '>=3.0.0 <4.0.0'
  logging: '>=1.3.0 <2.0.0'
  meta: '>=1.15.0 <2.0.0'
  package_config: '>=2.2.0 <3.0.0'
  path: '>=1.9.0 <2.0.0'
  source_gen: '>=4.0.0 <5.0.0'
  source_span: '>=1.10.0 <2.0.0'
  stack_trace: '>=1.11.0 <2.0.0'

dev_dependencies:
  build_runner: '>=2.16.0 <3.0.0'
  mockito: '>=5.4.0 <6.0.0'
  lints: '>=6.0.0 <7.0.0'
  test: '>=1.31.0 <2.0.0'
