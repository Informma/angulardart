name: angulardart_cli
version: 1.9.2
description: CLI scaffolding tool for AngularDart (Dart 3 compatible)
repository: https://github.com/flutterdocteur/angulardart/tree/main/angulardart_cli
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
topics:
  - cli
  - angular
  - scaffolding
  - code-generation

screenshots:
  - description: 'AngularDart CLI logo'
    path: logo.png

environment:
  sdk: '>=3.0.0 <4.0.0'

platforms:
  linux:
  macos:
  windows:

executables:
  ngdart:

dependencies:
  args: '>=2.5.0 <3.0.0'
  mustache_template: '>=2.0.0 <3.0.0'
  path: '>=1.9.0 <2.0.0'
dev_dependencies:
  lints: '>=6.0.0 <7.0.0'
  test: '>=1.31.0 <2.0.0'
