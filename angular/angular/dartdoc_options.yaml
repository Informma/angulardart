dartdoc:
  showUndocumentedCategories: true
  ignore:
    - ambiguous-doc-reference
    - ambiguous-reexport
    - broken-link
    - category-order-gives-missing-package-name
    - deprecated
    - no-defining-library-found
    - tool-error
    - unresolved-export
  errors:
    - unresolved-export
  warnings:
    - unknown-file
