targets:
  $default:
    builders:
      angulardart_components|scss_builder:
        enabled: True
      angulardart|angulardart:
        generate_for:
          exclude: ["lib/**"]

builders:
  angular_gallery:
    target: ":angular_gallery"
    import: "package:angulardart_gallery/builders.dart"
    builder_factories: [
      galleryAppBuilder,
      galleryLibBuilder,
      syntaxHighlightBuilder,
    ]
    build_extensions: {
      ".html": [".dart"],
      "$web$": ["index.html", "main.dart", "style.scss"]}
    auto_apply: dependents
    runs_before: ["angulardart|angulardart", "angulardart_components|scss_builder"]
