name: angulardart_components
version: 3.2.0
description: >
  Material Design UI components for AngularDart.
  Community-maintained fork of Google's original components.
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular_components/angular_components
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
topics:
  - angular
  - components
  - material-design
  - ui
  - web

screenshots:
  - description: 'AngularDart Components logo'
    path: logo.png

environment:
  sdk: '>=3.4.0 <4.0.0'

platforms:
  web:

dependencies:
  angulardart: ^9.0.0
  angulardart_forms: ^6.0.0
  async: ^2.11.0
  build: ^4.0.0
  build_config: ^1.1.0
  built_collection: ^5.1.0
  collection: ^1.18.0
  fixnum: ^1.1.0
  intl: ^0.20.0
  js: '>=0.6.3 <0.8.0'
  web: '>=0.5.0 <1.0.0'
  logging: ^1.3.0
  meta: ^1.15.0
  observable: ^0.24.0
  protobuf: ^3.0.0
  quiver: ^3.2.0
  sass_builder: ^2.2.0

dev_dependencies:
  path: ^1.9.0
  lints: ^6.0.0
  test: ^1.31.0
