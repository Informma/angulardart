  source_gen: ^1.5.0
  source_span: ^1.10.0
  stack_trace: ^1.11.0

dev_dependencies:
  build_runner: ^2.4.0
  mockito: ^5.4.0
  lints: ^4.0.0
  test: ^1.25.0
