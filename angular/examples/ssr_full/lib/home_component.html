<h1>Welcome to AngularDart SSR!</h1>
<p>This page is rendered on the server and demonstrates TransferState data transfer.</p>

<p class="server-indicator" *ngIf="hasServerData">This content was pre-rendered on the server.</p>
<p class="client-indicator" *ngIf="!hasServerData">Loading from client-side...</p>

<h2>Items ({{ items.length }})</h2>
<div class="item-grid">
  <div class="item-card" *ngFor="let item of items">
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
  </div>
</div>
