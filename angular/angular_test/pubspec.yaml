name: angulardart_test
repository: https://github.com/flutterdocteur/angulardart/tree/main/angular/angular_test
issue_tracker: https://github.com/flutterdocteur/angulardart/issues
homepage: https://angulardartreborn.com
documentation: https://angulardartreborn.com/guide
description: Testing utilities for AngularDart including TestBed, ComponentFixture, fake async zone, and component testing helpers.
version: 6.2.7
topics:
  - angular
  - testing
  - test-runner
  - web
screenshots:
  - description: 'AngularDart Test logo'
    path: logo.png
environment:
  sdk: '>=3.0.0 <4.0.0'
platforms:
  web:
dependencies:
  angulardart: '>=9.0.0 <10.0.0'
  angulardart_meta: '>=1.0.0 <2.0.0'
  collection: '>=1.18.0 <2.0.0'
  meta: '>=1.15.0 <2.0.0'
  lints: '>=6.1.0 <7.0.0'
  web: '>=0.5.0 <1.0.0'
dev_dependencies:
  angulardart_compiler: '>=5.0.0 <6.0.0'
  build_runner: '>=2.16.0 <3.0.0'
  build_test: '>=3.0.0 <4.0.0'
  build_web_compilers: '>=4.8.0 <5.0.0'
  test: '>=1.31.0 <2.0.0'
